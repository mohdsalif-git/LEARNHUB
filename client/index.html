<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script>
    (function () {
      try {
        var key = 'learnhub-theme';
        var stored = localStorage.getItem(key);
        var theme = stored || 'system';
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = 'dark';
        } else {
          document.documentElement.classList.remove('dark');
          document.documentElement.style.colorScheme = 'light';
        }
      } catch (e) { }
    })();
  </script>
  <title>Wingly — One Search. All Knowledge. Zero Cost.</title>
  <meta name="description"
    content="Find the best free learning resources in one place — videos, tutorials, courses, and guides curated from across the web." />
  <meta name="author" content="Wingly" />
  <meta name="theme-color" content="#4f46e5" />
  <meta property="og:title" content="Wingly — One Search. All Knowledge. Zero Cost." />
  <meta property="og:description"
    content="A community-powered aggregator of the best free learning resources across the web." />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Wingly" />
  <meta property="og:image" content="/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Wingly — One Search. All Knowledge. Zero Cost." />
  <meta name="twitter:description" content="Curated free learning resources from across the web." />
  <meta name="twitter:image" content="/og-image.png" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <!-- Google Fonts: Inter (body) + Outfit (display) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="canonical" href="https://wingly.dev/" />
  <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Wingly",
        "url": "https://wingly.dev/",
        "description": "A community-powered aggregator of the best free learning resources across the web.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://wingly.dev/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
