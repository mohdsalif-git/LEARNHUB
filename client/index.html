<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LearnHub — One Search. All Knowledge. Zero Cost.</title>
    <meta name="description" content="Find the best free learning resources in one place — videos, tutorials, courses, and guides from YouTube, freeCodeCamp, Google, Edureka and more." />
    <meta name="author" content="LearnHub" />
    <meta property="og:title" content="LearnHub — One Search. All Knowledge. Zero Cost." />
    <meta property="og:description" content="A community-powered aggregator of the best free learning resources across the web." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="LearnHub" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LearnHub — One Search. All Knowledge. Zero Cost." />
    <meta name="twitter:description" content="Curated free learning resources from across the web." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://learnhub.dev/" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "LearnHub",
        "url": "https://learnhub.dev/",
        "description": "A community-powered aggregator of the best free learning resources across the web.",
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "https://learnhub.dev/search?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
